name: Benchmark CI

on:
  push:
    branches: [ main, feature/** ]
  workflow_dispatch:

jobs:
  lint-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $GOPATH/bin v1.59.0
      - name: Run golangci-lint
        run: golangci-lint run ./...
      - name: Run tests
        run: go test ./...
      - name: Run benchmarks
        run: |
          mkdir -p bench_output
          go test -bench=. -benchmem ./... -run=^$ -cpuprofile=bench_output/cpu.prof -memprofile=bench_output/mem.prof
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-profiles
          path: bench_output/
